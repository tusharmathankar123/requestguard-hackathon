name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install API test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build Control Tower frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run offline evaluation
        run: python -m requestguard.evaluate
      - name: Run Control Tower tests with pytest
        run: python -m pytest tests/test_control_tower.py -q
